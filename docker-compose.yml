# Local single-host run. For Kubernetes use the manifests in k8s/.
# Values fall back to sensible defaults; override via a .env file or the shell.
services:
  sql-relationship-builder:
    build:
      context: .
      dockerfile: Dockerfile
    image: sql-relationship-builder:latest
    container_name: sql-relationship-builder
    ports:
      - "8501:8501"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      # Local OpenAI-compatible endpoint
      LOCAL_OPENAI_ENDPOINT: ${LOCAL_OPENAI_ENDPOINT:-http://localhost:8080}
      LOCAL_OPENAI_API_KEY: ${LOCAL_OPENAI_API_KEY:-}
      LOCAL_OPENAI_MODEL: ${LOCAL_OPENAI_MODEL:-llama3}
      # Azure OpenAI
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-02-01}
      AZURE_OPENAI_MODEL: ${AZURE_OPENAI_MODEL:-}
      LLM_VERIFY_SSL: ${LLM_VERIFY_SSL:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  admin:
    build:
      context: .
      dockerfile: Dockerfile
    image: sql-relationship-builder:latest
    container_name: sql-relationship-builder-admin
    ports:
      - "8550:8550"
    environment:
      ADMIN_ENCRYPTION_KEY: ${ADMIN_ENCRYPTION_KEY:-}
    entrypoint: ["streamlit", "run", "admin/admin.py",
        "--server.port=8550",
        "--server.address=0.0.0.0",
        "--server.headless=true",
        "--browser.gatherUsageStats=false"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8550/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
