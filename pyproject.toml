[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-relationship-builder"
version = "0.1.0"
description = "Streamlit app for SQL Server relationship building with deterministic relationship detection"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.30.0",
    "pyodbc>=5.0.0",
    "sqlglot>=25.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "networkx>=3.0",
    "pyvis>=0.3.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0.0",
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "cryptography>=41.0.0",
    "bcrypt>=4.0.0",
    "dotenv>=0.9.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "admin*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
