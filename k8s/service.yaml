apiVersion: v1
kind: Service
metadata:
  name: sql-relationship-builder
  labels:
    app: sql-relationship-builder
spec:
  type: ClusterIP
  selector:
    app: sql-relationship-builder
  # Pin a client to one pod (needed if replicas > 1, since Streamlit
  # sessions are server-side and bound to a single websocket).
  sessionAffinity: ClientIP
  ports:
    - name: http
      port: 80
      targetPort: http
